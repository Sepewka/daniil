<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Планер">
<meta name="theme-color" content="#1c1714">
<title>Планер для Даньки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Переменные темы по умолчанию (переопределяются JS на :root)
   ========================================================= */
:root{
  --bg:#1c1714; --bg-2:#241d18;
  --card:#2a221c; --card-2:#332921; --card-3:#3c3027;
  --line:#42352b; --line-2:#524236;
  --ink:#f2e5d2; --ink-2:#d5c0a5;
  --muted:#9a8570; --muted-2:#786450;
  --accent:#d98f4f; --accent-2:#b06b32;
  --gold:#c9a06a;
  --ok:#93a878; --danger:#c4604a;
  --fs:1;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg)}
body{
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
  transition:background .3s;
}

/* ============= ШРИФТ / ПЛОТНОСТЬ / СТИЛЬ ============= */
.app[data-font="small"]  { --fs: 0.92; }
.app[data-font="normal"] { --fs: 1;    }
.app[data-font="large"]  { --fs: 1.1;  }

.app[data-density="compact"]  { --pad-y: 10px; --gap: 6px;  --card-pad: 12px; }
.app[data-density="normal"]   { --pad-y: 13px; --gap: 8px;  --card-pad: 15px; }
.app[data-density="spacious"] { --pad-y: 16px; --gap: 11px; --card-pad: 18px; }

.app{
  width:100%;max-width:430px;
  height:100dvh;max-height:100dvh;
  background:var(--bg);
  color:var(--ink);
  display:flex;flex-direction:column;
  position:relative;overflow:hidden;
  font-size:calc(15px * var(--fs, 1));
  box-shadow:0 0 60px rgba(0,0,0,0.6);
  transition:background .3s, color .3s;
}

/* ============= HEADER ============= */
.app-header{
  display:flex;align-items:center;justify-content:space-between;
  padding: max(14px, env(safe-area-inset-top)) 18px 8px;
  gap:10px;flex:0 0 auto;
}
.crumb{
  font-size:calc(9.5px * var(--fs, 1));
  font-weight:700;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--muted);transition:color .3s;
}
.crumb b{color:var(--accent);font-weight:700}
.gear{
  width:34px;height:34px;border-radius:50%;
  background:var(--card);border:1px solid var(--line);color:var(--muted);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;transition:.15s;
}
.gear:active{background:var(--card-2);color:var(--accent)}
.gear svg{width:16px;height:16px}

/* ============= MAIN ============= */
.app-main{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
  padding:6px 18px 24px;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  scrollbar-width:none;
}
.app-main::-webkit-scrollbar{display:none}

/* ============= PAGE HEAD ============= */
.page-head{margin:4px 0 18px}
.page-title{
  font-family:'Fraunces',Georgia,serif;
  font-size:calc(34px * var(--fs, 1));font-weight:600;
  letter-spacing:-0.025em;line-height:1.02;margin:0 0 6px;color:var(--ink);
}
.page-sub{color:var(--muted);font-size:calc(13px * var(--fs, 1));line-height:1.4;margin:0}

/* ============= PROGRESS ============= */
.prog-card{
  background:var(--card);border:1px solid var(--line);
  padding:var(--card-pad) calc(var(--card-pad) + 1px);
  margin-bottom:20px;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  transition:background .3s, border-color .3s;
}
.prog-row{display:flex;align-items:baseline;gap:8px;margin-bottom:11px}
.prog-num{
  font-family:'Fraunces',Georgia,serif;
  font-size:calc(26px * var(--fs, 1));font-weight:700;
  color:var(--accent);letter-spacing:-0.02em;line-height:1;
  font-variant-numeric:tabular-nums;
}
.prog-total{
  font-family:'Fraunces',Georgia,serif;
  font-size:calc(15px * var(--fs, 1));font-weight:500;
  color:var(--muted);line-height:1;
}
.prog-label{
  font-size:calc(11px * var(--fs, 1));color:var(--muted);
  font-weight:600;letter-spacing:0.02em;margin-left:auto;text-transform:lowercase;
}
.prog-bar{
  height:5px;background:var(--bg-2);border-radius:3px;
  overflow:hidden;margin-bottom:11px;position:relative;transition:background .3s;
}
.prog-bar i{
  display:block;height:100%;
  background:linear-gradient(90deg, var(--gold), var(--accent));
  transition:width .4s cubic-bezier(.4,0,.2,1);border-radius:3px;
}
.prog-hint{
  font-size:calc(11px * var(--fs, 1));color:var(--muted-2);
  letter-spacing:0.01em;display:flex;align-items:center;gap:6px;
}
.prog-hint .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:0 0 auto}

/* ============= TASK ============= */
.task{
  display:flex;align-items:flex-start;gap:12px;
  padding:var(--pad-y) 14px var(--pad-y) 15px;
  margin-bottom:var(--gap);
  background:var(--card);border:1px solid var(--line);cursor:pointer;
  transition:background .15s, border-color .15s, padding .2s, margin .2s;
  clip-path:polygon(13px 0,100% 0,100% calc(100% - 13px),calc(100% - 13px) 100%,0 100%,0 13px);
}
.task:active{background:var(--card-2)}
.task.done{opacity:.5}
.task.done .task-title{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}

.time-badge{
  flex:0 0 auto;font-size:calc(12px * var(--fs, 1));font-weight:700;
  color:var(--accent);font-variant-numeric:tabular-nums;
  letter-spacing:0.02em;padding-top:2px;min-width:44px;
}
.task.done .time-badge{color:var(--muted)}
.task-body{flex:1;min-width:0}
.task-title{
  font-size:calc(15px * var(--fs, 1));font-weight:600;
  line-height:1.25;color:var(--ink);margin-bottom:2px;word-break:break-word;
}
.task-desc{
  font-size:calc(12px * var(--fs, 1));color:var(--muted);
  line-height:1.35;word-break:break-word;
}
.check{
  flex:0 0 auto;width:24px;height:24px;border-radius:50%;
  border:1.5px solid var(--line-2);background:transparent;color:transparent;
  cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;
  font-size:calc(13px * var(--fs, 1));font-weight:800;margin-top:1px;transition:all .18s;
}
.task.done .check{background:var(--ok);border-color:var(--ok);color:var(--bg)}

/* ============= EMPTY ============= */
.empty{text-align:center;padding:56px 22px;color:var(--muted)}
.empty-icon{font-size:42px;opacity:.35;margin-bottom:14px;color:var(--accent);font-family:'Fraunces',serif}
.empty-text{font-size:calc(13.5px * var(--fs, 1));line-height:1.6;color:var(--muted)}
.empty-text b{color:var(--ink-2);font-weight:700}

/* ============= GROUPS ============= */
.group{margin-bottom:26px}
.group-head{
  display:flex;align-items:baseline;gap:9px;
  font-size:calc(10px * var(--fs, 1));font-weight:800;
  text-transform:uppercase;letter-spacing:0.14em;color:var(--muted-2);
  margin-bottom:11px;padding-left:2px;
}
.group-head .badge{
  background:var(--card-2);color:var(--accent);
  padding:2px 8px;font-size:calc(9px * var(--fs, 1));
  letter-spacing:0.06em;font-weight:800;
  clip-path:polygon(3px 0,100% 0,100% calc(100% - 3px),calc(100% - 3px) 100%,0 100%,0 3px);
}

/* ============= CALENDAR ============= */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:8px}
.cal-title{
  font-family:'Fraunces',Georgia,serif;
  font-size:calc(26px * var(--fs, 1));font-weight:600;
  letter-spacing:-0.02em;text-align:center;flex:1;color:var(--ink);
}
.nav-btn{
  width:38px;height:38px;background:var(--card);border:1px solid var(--line);
  color:var(--ink);font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
  transition:background .15s;padding:0;font-family:inherit;flex:0 0 auto;
}
.nav-btn:active{background:var(--card-2);color:var(--accent)}

.cal-grid{display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));gap:6px;width:100%}
.cal-dow{
  text-align:center;font-size:calc(10px * var(--fs, 1));
  color:var(--muted-2);text-transform:uppercase;letter-spacing:0.1em;
  font-weight:800;padding:4px 0 10px;min-width:0;
}
.cal-day{
  min-width:0;aspect-ratio:1/1;
  background:var(--card);border:1px solid var(--line);
  cursor:pointer;position:relative;overflow:hidden;
  transition:background .15s, border-color .15s, box-shadow .15s;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  display:flex;align-items:center;justify-content:center;
}
.cal-day:active{background:var(--card-2)}
.cal-day.out{opacity:.28;background:var(--bg-2)}
.cal-day.out .num{color:var(--muted-2)}
.cal-day.sel{border-color:var(--accent);background:var(--card-2);box-shadow:inset 0 0 0 1px var(--accent)}
.cal-day .num{
  font-size:calc(15px * var(--fs, 1));font-weight:600;color:var(--ink-2);
  font-variant-numeric:tabular-nums;line-height:1;transition:color .15s;
}
.cal-day.today .num,
.cal-day.sel .num{color:var(--accent);font-weight:800}
.cal-day.has-tasks::before{
  content:'';position:absolute;top:0;right:0;width:0;height:0;
  border-top:14px solid var(--accent);border-left:14px solid transparent;
  opacity:.85;transition:opacity .15s;
}
.cal-day.has-tasks.sel::before{opacity:1}
.cal-day.out.has-tasks::before{opacity:.4}
.cal-day.done-all::before{border-top-color:var(--ok)}

/* ============= SETTINGS ============= */
.set-card{
  background:var(--card);border:1px solid var(--line);
  padding:var(--card-pad) calc(var(--card-pad) + 1px);
  margin-bottom:10px;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  transition:background .3s, border-color .3s;
}
.set-title{
  font-family:'Fraunces',Georgia,serif;
  font-size:calc(16px * var(--fs, 1));font-weight:600;
  color:var(--ink);margin:0 0 3px;letter-spacing:-0.01em;
}
.set-hint{
  font-size:calc(11.5px * var(--fs, 1));color:var(--muted);
  margin:0 0 4px;line-height:1.4;
}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.set-row + .set-row{border-top:1px solid var(--line)}
.set-label{font-size:calc(14px * var(--fs, 1));font-weight:600;color:var(--ink)}
.set-desc{font-size:calc(11.5px * var(--fs, 1));color:var(--muted);margin-top:2px;line-height:1.35}
.set-value{font-size:calc(13px * var(--fs, 1));color:var(--accent);font-weight:700}
.set-btn{
  background:var(--card-2);border:1px solid var(--line);
  color:var(--ink);font-family:inherit;
  padding:8px 14px;font-size:calc(12.5px * var(--fs, 1));font-weight:700;
  cursor:pointer;
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
  transition:.15s;
}
.set-btn:active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.set-btn.danger:active{background:var(--danger);border-color:var(--danger)}
.set-btn.block{width:100%;padding:12px;margin-top:8px}

/* ============= THEME PICKER ============= */
.theme-grid{display:grid;grid-template-columns:repeat(4, 1fr);gap:7px;margin-top:14px}
.theme-swatch{
  background:var(--bg);border:1.5px solid var(--line);
  padding:9px 4px 7px;cursor:pointer;font-family:inherit;color:var(--ink-2);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  transition:.15s;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
}
.theme-swatch:active{transform:scale(.94)}
.theme-swatch.active{border-color:var(--accent);background:var(--card-2)}
.swatch-dot{
  width:26px;height:26px;border-radius:50%;position:relative;
  box-shadow:0 2px 10px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;
}
.swatch-dot::after{
  content:'✓';font-size:13px;font-weight:800;
  color:rgba(0,0,0,.6);opacity:0;transition:.15s;
}
.theme-swatch.active .swatch-dot::after{opacity:1}
.swatch-name{
  font-size:calc(9.5px * var(--fs, 1));font-weight:700;
  letter-spacing:0.01em;text-align:center;line-height:1.1;
}
.theme-swatch.active .swatch-name{color:var(--accent)}

/* ============= SEGMENTED ============= */
.seg{
  display:flex;gap:4px;margin-top:10px;
  background:var(--bg);border:1px solid var(--line);
  padding:3px;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
}
.seg-btn{
  flex:1;background:transparent;border:none;
  padding:8px 4px;cursor:pointer;font-family:inherit;
  font-size:calc(11.5px * var(--fs, 1));font-weight:700;
  color:var(--muted);letter-spacing:0.02em;
  transition:.15s;
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
}
.seg-btn:active{color:var(--ink)}
.seg-btn.active{background:var(--accent);color:var(--bg)}

/* ============= SIGNATURE ============= */
.signature{text-align:center;padding:28px 20px 16px;margin-top:18px;position:relative}
.signature::before{
  content:'';display:block;width:60px;height:1px;
  background:var(--line);margin:0 auto 20px;
}
.sig-mark{
  font-size:calc(13px * var(--fs, 1));color:var(--accent);opacity:.7;
  margin-bottom:10px;letter-spacing:8px;padding-left:8px;
}
.sig-main{
  font-family:'Fraunces',Georgia,serif;
  font-size:calc(17px * var(--fs, 1));color:var(--ink-2);font-weight:500;
  letter-spacing:-0.01em;line-height:1.35;
}
.sig-main b{color:var(--accent);font-weight:600}
.sig-sub{
  font-size:calc(12px * var(--fs, 1));color:var(--muted);
  margin-top:5px;letter-spacing:0.01em;line-height:1.4;
}
.sig-sub b{color:var(--ink-2);font-weight:700}
.save-hint{
  margin-top:14px;font-size:calc(10.5px * var(--fs, 1));
  color:var(--muted-2);letter-spacing:0.04em;
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;background:var(--card-2);
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
}
.save-hint .ok-dot{
  width:6px;height:6px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 6px var(--ok);
}

/* ============= BOTTOM NAV ============= */
.bottom-nav{
  flex:0 0 auto;display:grid;
  grid-template-columns:1fr 1fr 78px 1fr 1fr;
  align-items:end;
  padding: 8px 6px calc(6px + env(safe-area-inset-bottom));
  background:var(--bg-2);border-top:1px solid var(--line);
  position:relative;z-index:20;
  transition:background .3s, border-color .3s;
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  background:transparent;border:none;padding:8px 2px 6px;
  color:var(--muted);font-size:calc(9.5px * var(--fs, 1));font-weight:700;
  letter-spacing:0.02em;cursor:pointer;font-family:inherit;
  transition:color .15s, transform .12s;position:relative;
}
.nav-item:active{transform:scale(0.94)}
.nav-item svg{
  width:23px;height:23px;stroke-width:1.8;
  stroke:currentColor;fill:none;
  stroke-linecap:round;stroke-linejoin:round;
  transition:filter .2s;
}
.nav-item.active{color:var(--accent)}
.nav-item.active svg{filter:drop-shadow(0 0 8px currentColor);opacity:.95}
.nav-item.active::before{
  content:'';position:absolute;top:2px;
  width:16px;height:2px;background:var(--accent);
  border-radius:2px;box-shadow:0 0 10px var(--accent);
}
.nav-label{white-space:nowrap}
.nav-add-wrap{display:flex;justify-content:center;position:relative;margin-bottom:6px}
.nav-add{
  width:56px;height:56px;border-radius:50%;border:none;
  background:linear-gradient(155deg, var(--accent), var(--accent-2));
  color:var(--bg);font-size:30px;font-weight:300;line-height:1;
  padding:0 0 4px 0;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;
  box-shadow:
    0 6px 22px rgba(0,0,0,0.35),
    0 0 0 4px var(--bg-2),
    0 0 0 5px var(--accent-2);
  transition:transform .12s;
}
.nav-add:active{transform:scale(0.9)}

/* =========================================================
   МОДАЛКА — непрозрачная, тёмный фон с сильным затемнением
   ========================================================= */
.backdrop{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.72);
  backdrop-filter:blur(10px) saturate(120%);
  -webkit-backdrop-filter:blur(10px) saturate(120%);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:100;
}
.backdrop.open{opacity:1;pointer-events:auto}

.sheet{
  width:100%;max-width:430px;
  background:var(--card);
  color:var(--ink);
  padding:24px 20px calc(26px + env(safe-area-inset-bottom));
  transform:translateY(100%);
  transition:transform .38s cubic-bezier(.32,.72,0,1);
  clip-path:polygon(0 0, calc(100% - 26px) 0, 100% 26px, 100% 100%, 0 100%);
  max-height:92dvh;overflow-y:auto;
  box-shadow:0 -20px 60px rgba(0,0,0,0.5);
  position:relative;
  z-index:1;
}
/* Мягкая подсветка сверху, чтобы плашка не сливалась с фоном */
.sheet::before{
  content:'';
  position:absolute;top:0;left:0;right:0;
  height:1px;
  background:linear-gradient(90deg, transparent, var(--line-2), transparent);
  pointer-events:none;
}
.backdrop.open .sheet{transform:translateY(0)}

.sheet-handle{width:38px;height:4px;background:var(--line-2);border-radius:2px;margin:-8px auto 16px}
.sheet-title{
  font-family:'Fraunces',Georgia,serif;
  font-size:calc(25px * var(--fs, 1));font-weight:600;
  margin:0 0 4px;letter-spacing:-0.02em;color:var(--ink);
}
.sheet-sub{font-size:calc(12.5px * var(--fs, 1));color:var(--muted);margin-bottom:20px}

.field{margin-bottom:14px}
.field label{
  display:block;font-size:calc(10.5px * var(--fs, 1));font-weight:800;
  text-transform:uppercase;letter-spacing:0.13em;color:var(--muted-2);margin-bottom:7px;
}
.field input,.field select{
  width:100%;
  background:var(--bg-2);        /* было var(--bg) — теперь на пол-тона светлее, чтобы отличалось от sheet */
  border:1px solid var(--line);
  color:var(--ink);font-family:inherit;
  font-size:calc(15px * var(--fs, 1));
  padding:13px 14px;outline:none;
  transition:border-color .15s, background .15s;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  -webkit-appearance:none;appearance:none;border-radius:0;
}
.field input:focus,.field select:focus{
  border-color:var(--accent);
  background:var(--card-2);
}
.field input::placeholder{color:var(--muted-2)}
.field select{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M2 4l4 4 4-4' stroke='%239a8570' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 15px center;
  background-size:12px;padding-right:38px;
}
.field input[type="time"],.field input[type="date"]{font-variant-numeric:tabular-nums}
.field input[type="date"]::-webkit-calendar-picker-indicator,
.field input[type="time"]::-webkit-calendar-picker-indicator{
  filter:invert(0.75) sepia(0.3) saturate(2) hue-rotate(-10deg);cursor:pointer;
}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:11px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.chip{
  background:var(--bg-2);border:1px solid var(--line);color:var(--ink-2);
  font-family:inherit;font-size:calc(12px * var(--fs, 1));font-weight:600;
  padding:8px 12px;cursor:pointer;transition:all .15s;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
}
.chip:active{background:var(--accent);color:var(--bg);border-color:var(--accent)}

.sheet-actions{display:flex;gap:9px;margin-top:22px}
.btn{
  flex:1;border:none;padding:15px;font-family:inherit;
  font-size:calc(14px * var(--fs, 1));font-weight:700;
  cursor:pointer;transition:all .15s;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  letter-spacing:0.02em;
}
.btn-ghost{background:var(--card-2);color:var(--ink-2);border:1px solid var(--line)}
.btn-ghost:active{background:var(--card-3)}
.btn-primary{
  background:linear-gradient(150deg, var(--accent), var(--accent-2));
  color:#fff;
  box-shadow:0 6px 20px rgba(0,0,0,0.35);
}
.btn-primary:active{transform:scale(0.98)}

/* ============= СТИЛЬ УГЛОВ ============= */
.app[data-corner="rounded"] .task,
.app[data-corner="rounded"] .prog-card,
.app[data-corner="rounded"] .set-card,
.app[data-corner="rounded"] .cal-day,
.app[data-corner="rounded"] .nav-btn,
.app[data-corner="rounded"] .chip,
.app[data-corner="rounded"] .btn,
.app[data-corner="rounded"] .set-btn,
.app[data-corner="rounded"] .theme-swatch,
.app[data-corner="rounded"] .field input,
.app[data-corner="rounded"] .field select,
.app[data-corner="rounded"] .seg,
.app[data-corner="rounded"] .seg-btn,
.app[data-corner="rounded"] .group-head .badge,
.app[data-corner="rounded"] .save-hint{
  clip-path:none !important;
  border-radius:14px !important;
}
.app[data-corner="rounded"] .task{border-radius:16px !important}
.app[data-corner="rounded"] .cal-day{border-radius:12px !important}
.app[data-corner="rounded"] .sheet{
  clip-path:none !important;
  border-radius:26px 26px 0 0 !important;
}
.app[data-corner="rounded"] .nav-btn,
.app[data-corner="rounded"] .seg-btn{border-radius:9px !important}
.app[data-corner="rounded"] .btn{border-radius:14px !important}
.app[data-corner="rounded"] .group-head .badge{border-radius:20px !important}

@media (max-width:360px){
  .page-title{font-size:calc(29px * var(--fs, 1))}
  .cal-title{font-size:calc(22px * var(--fs, 1))}
  .nav-add{width:50px;height:50px;font-size:26px}
  .bottom-nav{grid-template-columns:1fr 1fr 66px 1fr 1fr}
  .nav-item svg{width:21px;height:21px}
  .nav-item{font-size:calc(9px * var(--fs, 1))}
  .app-main{padding:6px 14px 20px}
  .app-header{padding-left:14px;padding-right:14px}
  .cal-day .num{font-size:calc(13px * var(--fs, 1))}
  .cal-day.has-tasks::before{border-top-width:11px;border-left-width:11px}
  .theme-grid{grid-template-columns:repeat(3,1fr);gap:6px}
  .swatch-dot{width:24px;height:24px}
}

<script>
/* ============================================================

    gold:'#b89164', ok:'#6f8a55', danger:'#ad4634'

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
const MONTHS      = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_GEN  = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const DOW         = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const DOW_FULL    = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];

const pad  = n => String(n).padStart(2,'0');
const ymd  = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const todayStr = ymd(new Date());
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id'+Date.now()+Math.random().toString(16).slice(2));

function longDate(key){
  const d = fromYmd(key);
  return `${d.getDate()} ${MONTHS_GEN[d.getMonth()]}, ${DOW_FULL[d.getDay()]}`;
}
function dayTitle(key){
  if(key === todayStr) return 'Сегодня';
  const d = fromYmd(key);
  return `${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`;
}
function sortTasks(list){
  return list.slice().sort((a,b) => {
    if(a.done !== b.done) return a.done - b.done;
    const at = a.time || '99:99';
    const bt = b.time || '99:99';
    if(at !== bt) return at.localeCompare(bt);
    return (a.title||'').localeCompare(b.title||'');
  });
}

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
const STORAGE_KEY = 'planner-v5';

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && Array.isArray(s.tasks)) return normalizeState(s);
    }
  }catch(e){ console.warn('Не удалось загрузить', e); }
  return defaultState();
}

function defaultState(){
  return {
    tasks: [
      { id: uid(), title: 'Утренняя зарядка',  desc: '15 минут',           date: todayStr, time: '07:30', done: true,  priority: 'normal' },
      { id: uid(), title: 'Завтрак и кофе',    desc: 'Белок + углеводы',    date: todayStr, time: '08:30', done: true,  priority: 'normal' },
      { id: uid(), title: 'Созвон с командой', desc: 'Обсудить спринт',      date: todayStr, time: '10:00', done: false, priority: 'high'   },
      { id: uid(), title: 'Прогулка в парке',  desc: '30 минут на воздухе',  date: todayStr, time: '14:00', done: false, priority: 'low'    },
      { id: uid(), title: 'Чтение',            desc: 'Минимум 20 страниц',   date: todayStr, time: '20:00', done: false, priority: 'normal' },
      { id: uid(), title: 'Дневник',           desc: 'Итоги дня',            date: todayStr, time: '22:30', done: false, priority: 'low'    }
    ],
    templates: [
      { title:'Зарядка',     time:'07:00', desc:'15 минут' },
      { title:'Завтрак',     time:'08:30', desc:'Белок + углеводы' },
      { title:'Обед',        time:'13:00', desc:'Основной приём' },
      { title:'Тренировка',  time:'18:00', desc:'45 минут' },
      { title:'Ужин',        time:'19:30', desc:'Белок + овощи' },
      { title:'Чтение',      time:'21:00', desc:'20 страниц' },
      { title:'Дневник',     time:'22:30', desc:'Итоги дня' }
    ],
    selected: todayStr,
    view: 'day',
    theme: 'coffee',
    corner: 'cut',
    density: 'normal',
    font: 'normal'
  };
}

function normalizeState(s){
  const d = defaultState();
  return {
    tasks: Array.isArray(s.tasks) ? s.tasks : [],
    templates: Array.isArray(s.templates) && s.templates.length ? s.templates : d.templates,
    selected: s.selected || todayStr,
    view: s.view || 'day',
    theme: s.theme || 'coffee',
    corner: s.corner || 'cut',
    density: s.density || 'normal',
    font: s.font || 'normal'
  };
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const hint = document.getElementById('saveHint');
    if(hint) hint.style.opacity = '1';
  }catch(e){ console.warn('Не удалось сохранить', e); }
}

/* ============================================================
   ПРИМЕНЕНИЕ ТЕМЫ — теперь на :root, чтобы работало и в модалке
   ============================================================ */
function applyTheme(){
  const t = THEMES.find(x => x.key === state.theme) || THEMES[0];
  const v = t.vars;
  const root = document.documentElement;
  root.style.setProperty('--bg',       v.bg);
  root.style.setProperty('--bg-2',     v.bg2);
  root.style.setProperty('--card',     v.card);
  root.style.setProperty('--card-2',   v.card2);
  root.style.setProperty('--card-3',   v.card3);
  root.style.setProperty('--line',     v.line);
  root.style.setProperty('--line-2',   v.line2);
  root.style.setProperty('--ink',      v.ink);
  root.style.setProperty('--ink-2',    v.ink2);
  root.style.setProperty('--muted',    v.muted);
  root.style.setProperty('--muted-2',  v.muted2);
  root.style.setProperty('--accent',   v.accent);
  root.style.setProperty('--accent-2', v.accent2);
  root.style.setProperty('--gold',     v.gold);
  root.style.setProperty('--ok',       v.ok);
  root.style.setProperty('--danger',   v.danger);
  document.body.style.background = v.bg;
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', v.bg);
}

function applyPrefs(){
  const app = document.getElementById('app');
  app.setAttribute('data-corner',  state.corner  || 'cut');
  app.setAttribute('data-density', state.density || 'normal');
  app.setAttribute('data-font',    state.font    || 'normal');
  applyTheme();
}

let bigCursor = fromYmd(state.selected); bigCursor.setDate(1);

/* ============================================================
   РЕНДЕР
   ============================================================ */
function renderAll(){
  applyPrefs();

  document.querySelectorAll('.nav-item').forEach(b =>
    b.classList.toggle('active', b.dataset.view === state.view)
  );

  const crumbMap = {
    day:      `ПЛАНЕР · <b>${state.selected === todayStr ? 'СЕГОДНЯ' : dayTitle(state.selected).toUpperCase()}</b>`,
    all:      `ПЛАНЕР · <b>ВСЕ ЗАДАЧИ</b>`,
    calendar: `ПЛАНЕР · <b>КАЛЕНДАРЬ</b>`,
    more:     `ПЛАНЕР · <b>ЕЩЁ</b>`
  };
  document.getElementById('crumb').innerHTML = crumbMap[state.view] || crumbMap.day;

  const el = document.getElementById('view');
  if(state.view === 'day')           el.innerHTML = viewDay();
  else if(state.view === 'all')      el.innerHTML = viewAll();
  else if(state.view === 'calendar') el.innerHTML = viewCalendar();
  else                               el.innerHTML = viewMore();

  saveState();
}

function viewDay(){
  const key = state.selected;
  const list = sortTasks(state.tasks.filter(t => t.date === key));
  const done = list.filter(t => t.done).length;
  const pct  = list.length ? Math.round(done / list.length * 100) : 0;

  return `
    <div class="page-head">
      <h2 class="page-title">${key === todayStr ? 'Сегодня' : dayTitle(key)}</h2>
      <p class="page-sub">${longDate(key)}</p>
    </div>

    <div class="prog-card">
      <div class="prog-row">
        <span class="prog-num">${done}</span>
        <span class="prog-total">/ ${list.length}</span>
        <span class="prog-label">сегодня</span>
      </div>
      <div class="prog-bar"><i style="width:${pct}%"></i></div>
      <div class="prog-hint"><span class="dot"></span>Задачи отсортированы по времени</div>
    </div>

    ${ list.length
        ? list.map(t => taskRow(t, false)).join('')
        : `<div class="empty">
             <div class="empty-icon">✎</div>
             <div class="empty-text">На этот день пока пусто.<br>Нажмите <b>«+»</b> внизу, чтобы добавить задачу.</div>
           </div>` }
  `;
}

function viewAll(){
  if(!state.tasks.length){
    return `<div class="page-head"><h2 class="page-title">Все задачи</h2><p class="page-sub">Пока ничего не добавлено</p></div>
            <div class="empty"><div class="empty-icon">✎</div><div class="empty-text">Список пуст</div></div>`;
  }
  const byDate = {};
  state.tasks.forEach(t => { (byDate[t.date] ||= []).push(t); });

  return `
    <div class="page-head">
      <h2 class="page-title">Все задачи</h2>
      <p class="page-sub">${state.tasks.length} ${state.tasks.length === 1 ? 'запись' : (state.tasks.length < 5 ? 'записи' : 'записей')} по датам</p>
    </div>
    ${Object.keys(byDate).sort().map(k => {
      const list = sortTasks(byDate[k]);
      return `
        <div class="group">
          <div class="group-head">
            ${longDate(k)}
            ${k === todayStr ? '<span class="badge">сегодня</span>' : ''}
            ${k < todayStr ? '<span class="badge" style="color:var(--danger)">прошлое</span>' : ''}
          </div>
          ${list.map(t => taskRow(t, false)).join('')}
        </div>`;
    }).join('')}
  `;
}

function viewCalendar(){
  const y = bigCursor.getFullYear(), m = bigCursor.getMonth();
  const cells = buildCells(bigCursor);

  return `
    <div class="page-head">
      <h2 class="page-title">Календарь</h2>
      <p class="page-sub">Выберите день, чтобы посмотреть задачи</p>
    </div>

    <div class="cal-header">
      <button class="nav-btn" data-act="big-prev">‹</button>
      <div class="cal-title">${MONTHS[m]} ${y}</div>
      <button class="nav-btn" data-act="big-next">›</button>
    </div>

    <div class="cal-grid">
      ${DOW.map(d => `<div class="cal-dow">${d}</div>`).join('')}
      ${cells.map(c => {
        const tasks = state.tasks.filter(t => t.date === c.key);
        const hasTasks = tasks.length > 0;
        const allDone = hasTasks && tasks.every(t => t.done);
        return `
          <div class="cal-day ${c.out?'out':''} ${c.key===state.selected?'sel':''} ${c.key===todayStr?'today':''} ${hasTasks?'has-tasks':''} ${allDone?'done-all':''}"
               data-act="pick-date" data-date="${c.key}">
            <span class="num">${c.day}</span>
          </div>`;
      }).join('')}
    </div>

    <button class="set-btn block" data-act="big-today">Перейти к сегодня</button>
  `;
}

function viewMore(){
  const total = state.tasks.length;
  const done  = state.tasks.filter(t => t.done).length;
  const days  = new Set(state.tasks.map(t => t.date)).size;

  const corners = [
    { key:'cut',     label:'Срез'   },
    { key:'rounded', label:'Круг'   }
  ];
  const densities = [
    { key:'compact',  label:'Плотно' },
    { key:'normal',   label:'Обычно' },
    { key:'spacious', label:'Просторно' }
  ];
  const fonts = [
    { key:'small',  label:'Мелкий' },
    { key:'normal', label:'Обычный' },
    { key:'large',  label:'Крупный' }
  ];

  return `
    <div class="page-head">
      <h2 class="page-title">Ещё</h2>
      <p class="page-sub">Настройки, стиль и статистика</p>
    </div>

    <div class="set-card">
      <h3 class="set-title">Цветовая гамма</h3>
      <p class="set-hint">${THEMES.length} тем — выбери настроение</p>
      <div class="theme-grid">
        ${THEMES.map(t => `
          <button class="theme-swatch ${state.theme === t.key ? 'active' : ''}"
                  data-act="theme" data-theme="${t.key}">
            <span class="swatch-dot" style="background:linear-gradient(145deg, ${t.vars.accent}, ${t.vars.accent2});"></span>
            <span class="swatch-name">${t.name}</span>
          </button>
        `).join('')}
      </div>
    </div>

    <div class="set-card">
      <h3 class="set-title">Форма углов</h3>
      <p class="set-hint">Острые срезы или мягкие скругления</p>
      <div class="seg">
        ${corners.map(c => `
          <button class="seg-btn ${state.corner === c.key ? 'active' : ''}"
                  data-act="pref" data-key="corner" data-value="${c.key}">${c.label}</button>
        `).join('')}
      </div>
    </div>

    <div class="set-card">
      <h3 class="set-title">Плотность</h3>
      <p class="set-hint">Сколько задач помещается на экране</p>
      <div class="seg">
        ${densities.map(c => `
          <button class="seg-btn ${state.density === c.key ? 'active' : ''}"
                  data-act="pref" data-key="density" data-value="${c.key}">${c.label}</button>
        `).join('')}
      </div>
    </div>

    <div class="set-card">
      <h3 class="set-title">Размер текста</h3>
      <p class="set-hint">Под себя и своё зрение</p>
      <div class="seg">
        ${fonts.map(c => `
          <button class="seg-btn ${state.font === c.key ? 'active' : ''}"
                  data-act="pref" data-key="font" data-value="${c.key}">${c.label}</button>
        `).join('')}
      </div>
    </div>

    <div class="set-card">
      <div class="set-row">
        <div><div class="set-label">Всего задач</div><div class="set-desc">За всю историю</div></div>
        <div class="set-value">${total}</div>
      </div>
      <div class="set-row">
        <div><div class="set-label">Выполнено</div><div class="set-desc">Отмечено галочкой</div></div>
        <div class="set-value">${done}</div>
      </div>
      <div class="set-row">
        <div><div class="set-label">Активных дней</div><div class="set-desc">Дней с задачами</div></div>
        <div class="set-value">${days}</div>
      </div>
    </div>

    <div class="set-card">
      <h3 class="set-title">Сохранение данных</h3>
      <p class="set-hint">Всё хранится на устройстве. Сделай бэкап — не потеряешь.</p>
      <button class="set-btn block" data-act="export">📤 Скачать бэкап (.json)</button>
      <button class="set-btn block" data-act="import">📥 Загрузить из файла</button>
    </div>

    <div class="set-card">
      <div class="set-row">
        <div><div class="set-label">Очистить выполненные</div><div class="set-desc">Удалить отмеченные задачи</div></div>
        <button class="set-btn" data-act="clear-done">Очистить</button>
      </div>
      <div class="set-row">
        <div><div class="set-label">Сбросить всё</div><div class="set-desc">Удалить все задачи без отмены</div></div>
        <button class="set-btn danger" data-act="reset-all">Сброс</button>
      </div>
    </div>

    <div class="signature">
      <div class="sig-mark">✦ ✦ ✦</div>
      <div class="sig-main">Планер для <b>Даньки</b></div>
      <div class="sig-sub">от его друга <b>Sepewki</b></div>
      <div class="save-hint" id="saveHint"><span class="ok-dot"></span>сохранено на устройстве</div>
    </div>
  `;
}

function taskRow(t){
  return `
    <div class="task ${t.done?'done':''}" data-id="${t.id}">
      ${t.time ? `<div class="time-badge">${t.time}</div>` : `<div class="time-badge" style="color:var(--muted-2)">—</div>`}
      <div class="task-body">
        <div class="task-title">${esc(t.title)}</div>
        ${t.desc ? `<div class="task-desc">${esc(t.desc)}</div>` : ''}
      </div>
      <button class="check" data-act="toggle">${t.done?'✓':''}</button>
    </div>`;
}

function buildCells(cursor){
  const y = cursor.getFullYear(), m = cursor.getMonth();
  const first = new Date(y, m, 1);
  const shift = (first.getDay() + 6) % 7;
  const start = new Date(y, m, 1 - shift);
  const cells = [];
  for(let i = 0; i < 42; i++){
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    cells.push({ key: ymd(d), day: d.getDate(), out: d.getMonth() !== m });
  }
  return cells;
}

function renderChips(){
  document.getElementById('chips').innerHTML =
    state.templates.map(t =>
      `<span class="chip" data-act="chip" data-title="${esc(t.title)}" data-time="${esc(t.time)}" data-desc="${esc(t.desc||'')}">${esc(t.title)} · ${t.time}</span>`
    ).join('');
}

/* ============================================================
   МОДАЛКА
   ============================================================ */
const modal = document.getElementById('modal');
const titleInput = document.getElementById('tTitle');
const descInput  = document.getElementById('tDesc');
const dateInput  = document.getElementById('tDate');
const timeInput  = document.getElementById('tTime');
const prioInput  = document.getElementById('tPrio');

function openModal(){
  titleInput.value = '';
  descInput.value = '';
  dateInput.value = state.selected;
  timeInput.value = '';
  prioInput.value = 'normal';
  titleInput.style.borderColor = '';
  renderChips();
  modal.classList.add('open');
  setTimeout(() => titleInput.focus(), 130);
}
function closeModal(){ modal.classList.remove('open'); }

function saveTask(){
  const title = titleInput.value.trim();
  if(!title){ titleInput.focus(); titleInput.style.borderColor = 'var(--danger)'; return; }

  const date = dateInput.value || state.selected;
  state.tasks.push({
    id: uid(), title,
    desc: descInput.value.trim(),
    date,
    time: timeInput.value || '',
    done: false,
    priority: prioInput.value
  });
  state.selected = date;
  bigCursor = fromYmd(date); bigCursor.setDate(1);

  closeModal();
  renderAll();
}

/* ============================================================
   ЭКСПОРТ / ИМПОРТ
   ============================================================ */
function exportData(){
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const fname = `planer-backup-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.json`;
  a.href = url; a.download = fname;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(file){
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || !Array.isArray(parsed.tasks)){
        alert('Неверный файл бэкапа');
        return;
      }
      state = normalizeState(parsed);
      bigCursor = fromYmd(state.selected); bigCursor.setDate(1);
      renderAll();
      alert('Импорт успешен ✓');
    }catch(err){
      alert('Ошибка при чтении файла');
      console.error(err);
    }
  };
  reader.readAsText(file);
}

/* ============================================================
   СОБЫТИЯ
   ============================================================ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const act = t.dataset.act;

  if(act === 'add'){ openModal(); return; }
  if(act === 'close-modal'){ closeModal(); return; }
  if(act === 'save-task'){ saveTask(); return; }

  if(act === 'theme'){
    state.theme = t.dataset.theme;
    applyTheme();
    saveState();
    document.querySelectorAll('.theme-swatch').forEach(b =>
      b.classList.toggle('active', b.dataset.theme === state.theme)
    );
    return;
  }

  if(act === 'pref'){
    const key = t.dataset.key;
    const value = t.dataset.value;
    state[key] = value;
    applyPrefs();
    saveState();
    document.querySelectorAll(`.seg-btn[data-key="${key}"]`).forEach(b =>
      b.classList.toggle('active', b.dataset.value === value)
    );
    return;
  }

  if(act === 'export'){ exportData(); return; }
  if(act === 'import'){ document.getElementById('importFile').click(); return; }

  if(act === 'view'){
    state.view = t.dataset.view;
    if(state.view === 'calendar'){
      bigCursor = fromYmd(state.selected); bigCursor.setDate(1);
    }
    renderAll();
    return;
  }

  if(act === 'chip'){
    titleInput.value = t.dataset.title;
    timeInput.value  = t.dataset.time;
    descInput.value  = t.dataset.desc || '';
    titleInput.focus();
    return;
  }

  if(act === 'pick-date'){
    state.selected = t.dataset.date;
    bigCursor = fromYmd(state.selected); bigCursor.setDate(1);
    state.view = 'day';
    renderAll();
    return;
  }

  if(act === 'big-prev'){ bigCursor.setMonth(bigCursor.getMonth()-1); renderAll(); return; }
  if(act === 'big-next'){ bigCursor.setMonth(bigCursor.getMonth()+1); renderAll(); return; }

  if(act === 'big-today'){
    state.selected = todayStr;
    bigCursor = new Date(); bigCursor.setDate(1);
    state.view = 'day';
    renderAll();
    return;
  }

  if(act === 'clear-done'){
    if(confirm('Удалить все выполненные задачи?')){
      state.tasks = state.tasks.filter(x => !x.done);
      renderAll();
    }
    return;
  }
  if(act === 'reset-all'){
    if(confirm('Удалить ВСЕ задачи? Это действие нельзя отменить.')){
      state.tasks = [];
      renderAll();
    }
    return;
  }

  if(act === 'toggle'){
    const row = t.closest('.task');
    if(!row) return;
    const id = row.dataset.id;
    const idx = state.tasks.findIndex(x => x.id === id);
    if(idx === -1) return;
    state.tasks[idx].done = !state.tasks[idx].done;
    renderAll();
  }
});

document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeModal();
  if(e.key === 'Enter' && modal.classList.contains('open')){
    if(document.activeElement === titleInput || document.activeElement === descInput || document.activeElement === timeInput){
      saveTask();
    }
  }
});

modal.addEventListener('mousedown', e => { if(e.target === modal) closeModal(); });

document.getElementById('importFile').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if(file) importData(file);
  e.target.value = '';
});

const obs = new MutationObserver(() => {
  document.body.style.overflow = modal.classList.contains('open') ? 'hidden' : '';
});
obs.observe(modal, { attributes:true, attributeFilter:['class'] });

/* ============================================================
   СТАРТ
   ============================================================ */
renderAll();
</script>
</body>
</html>
